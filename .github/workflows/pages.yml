name: Publicar en GitHub Pages

# Compila el sitio estático (frontend/) y lo publica en https://nieldro.github.io/RUIDO/ en cada push a main.
# Una sola vez, en el repo: Settings → Pages → Build and deployment → Source: «GitHub Actions».

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /RUIDO
          NEXT_PUBLIC_SITE_URL: https://nieldro.github.io/RUIDO
          # Opcional: define la variable de repositorio API_URL cuando el backend esté desplegado.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_N8N_ENABLED: ${{ vars.N8N_ENABLED }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
